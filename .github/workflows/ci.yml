name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install Pillow
      - run: python -m unittest discover -s tests -v
      - run: python ml/scripts/validate_dataset.py ml/data/sample
      - run: python -m py_compile apps/ai-service/main.py ml/evaluation/benchmark_checkpoints.py ml/training/audit_caption_balance.py

  studio:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run typecheck
